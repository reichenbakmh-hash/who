<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Les Derniers Échos de Lily</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div id="vignette"></div>
<div id="flash"></div>
<div id="glitchbar"></div>

<div id="preamble">
  <div id="staticNoise"></div>
  <div id="tapHint">appuyer pour commencer</div>
  <div id="shakeWrap">
    <div id="introText"></div>
    <div id="introMock" class="hidden">
      <div class="miniChatHeader"><span class="dot"></span>Lily</div>
      <div class="miniChatBody">
        <div class="typingRow"><span class="typingDot"></span><span class="typingDot"></span><span class="typingDot"></span></div>
      </div>
    </div>
    <div id="introPhoto" class="hidden">
      <div class="photoFrame">
        <div class="photoNoise"></div>
        <div class="photoCaption">salon.jpg — envoyé à l'instant</div>
      </div>
    </div>
  </div>
  <div id="bigFlash" class="hidden"></div>
  <button id="enterBtn" class="hidden">▶ ENTRER DANS SES COMPTES</button>
</div>

<div id="phone" class="hidden">
  <div class="notch"></div>
  <div class="statusbar">
    <span id="clock">03:12</span>
    <span class="sbicons">▂▄▆ 5G 🔋78</span>
  </div>

  <div id="homescreen">
    <div class="appgrid">
      <button class="appicon" data-app="messenger">
        <span class="glyph glyph-messenger">
          <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M4 6.2C4 5 5 4 6.2 4h11.6C19 4 20 5 20 6.2v8.6c0 1.2-1 2.2-2.2 2.2H9.8L5 21v-3.8c-.6-.2-1-.8-1-1.4V6.2z" fill="#fff"/>
          </svg>
        </span><span>Messenger</span>
      </button>
      <button class="appicon" data-app="instagram">
        <span class="glyph glyph-insta">
          <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <rect x="3.2" y="6" width="17.6" height="14" rx="4" stroke="#fff" stroke-width="1.7"/>
            <path d="M8 6l1.3-2.2h5.4L16 6" stroke="#fff" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
            <circle cx="12" cy="13.2" r="4" stroke="#fff" stroke-width="1.7"/>
            <circle cx="16.8" cy="9.4" r="0.9" fill="#fff"/>
          </svg>
        </span><span>Instagram</span>
      </button>
      <button class="appicon" data-app="notes">
        <span class="glyph glyph-notes">
          <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <rect x="5" y="3" width="14" height="18" rx="2.2" stroke="#fff" stroke-width="1.7"/>
            <line x1="8" y1="8.2" x2="16" y2="8.2" stroke="#fff" stroke-width="1.5" stroke-linecap="round"/>
            <line x1="8" y1="12" x2="16" y2="12" stroke="#fff" stroke-width="1.5" stroke-linecap="round"/>
            <line x1="8" y1="15.8" x2="13" y2="15.8" stroke="#fff" stroke-width="1.5" stroke-linecap="round"/>
          </svg>
        </span><span>Notes</span>
      </button>
      <button class="appicon" data-app="fichiers">
        <span class="glyph glyph-files">
          <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M3.5 7.2c0-.7.55-1.2 1.2-1.2h4.6l1.8 2h8.4c.66 0 1.2.54 1.2 1.2v8.4c0 .77-.63 1.4-1.4 1.4H4.9c-.77 0-1.4-.63-1.4-1.4V7.2z" fill="#fff"/>
          </svg>
        </span><span>Fichiers</span>
      </button>
      <button class="appicon" data-app="portier">
        <span class="glyph glyph-portier">
          <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M12 3.2c-3.2 0-5.8 2.6-5.8 5.8v3.6l-1.4 2.8h14.4l-1.4-2.8V9c0-3.2-2.6-5.8-5.8-5.8z" fill="#fff"/>
            <path d="M9.6 17.8a2.4 2.4 0 0 0 4.8 0" stroke="#fff" stroke-width="1.5" stroke-linecap="round"/>
          </svg>
        </span><span>Portier</span>
      </button>
    </div>
    <button id="sleepBtn" class="hidden">🌙 fermer les yeux un instant</button>
  </div>

  <div class="appscreen" id="app-messenger">
    <div class="appheader"><button class="back" data-back>‹</button><span>Messages</span></div>
    <div id="threadList" class="threadList"></div>
    <div id="threadView" class="threadView hidden">
      <div class="appheader">
        <button class="back" data-thread-back>‹</button>
        <span id="threadAvatar" class="threadAvatar"></span>
        <span id="threadName"></span>
        <span id="threadStatus" class="threadStatus"></span>
      </div>
      <div id="messagesList" class="messagesList"></div>
      <div class="inputBar"><span class="inputPlaceholder">Aa</span></div>
    </div>
  </div>

  <div class="appscreen" id="app-instagram">
    <div class="appheader"><button class="back" data-back>‹</button><span class="igLogo">Instagram</span></div>
    <div class="igScroll">
      <div class="igProfile">
        <div class="igAvatar"></div>
        <div class="igHandle" id="igHandle"></div>
        <div class="igStats" id="igStats"></div>
        <div class="igBio" id="igBio"></div>
      </div>
      <div class="storiesRow">
        <div class="storyBubble" id="storyArchived">
          <div class="storyRing"></div>
          <span>archivée</span>
        </div>
      </div>
      <div id="igFeed"></div>
    </div>
  </div>

  <div class="appscreen" id="app-notes">
    <div class="appheader"><button class="back" data-back>‹</button><span>Notes</span></div>
    <div id="notesList" class="notesList"></div>
    <div id="noteView" class="noteView hidden">
      <div class="appheader"><button class="back" data-note-back>‹</button><span id="noteDate"></span></div>
      <div id="noteBody" class="noteBody"></div>
    </div>
  </div>

  <div class="appscreen" id="app-fichiers">
    <div class="appheader"><button class="back" data-back>‹</button><span>Fichiers</span></div>
    <div class="tabRow">
      <button class="tabBtn active" data-tab="photos">Photos</button>
      <button class="tabBtn" data-tab="brouillons">Brouillons</button>
      <button class="tabBtn" id="preuvesTab" data-tab="preuves" disabled>🔒 preuves</button>
      <button class="tabBtn" id="chronologieTab" data-tab="chronologie" disabled>🔒 chrono</button>
    </div>
    <div id="tab-photos" class="tabPane"><div id="photoGrid" class="photoGrid"></div></div>
    <div id="tab-brouillons" class="tabPane hidden">
      <p class="fileText" id="brouillonText"></p>
      <p class="fileHint" id="brouillonHint"></p>
      <div class="pwrow">
        <input id="pwInput" type="text" placeholder="mot de passe">
        <button onclick="tryPassword()">Déverrouiller</button>
      </div>
      <div class="errmsg" id="pwError"></div>
    </div>
    <div id="tab-preuves" class="tabPane hidden">
      <div id="preuvesContent"></div>
      <button class="continueBtn" onclick="goToChronologieOrHint()">continuer...</button>
    </div>
    <div id="tab-chronologie" class="tabPane hidden">
      <p class="fileHint">Recouper chaque élément avec ce que je sais déjà.</p>
      <div id="chronologieContent"></div>
      <button class="continueBtn finalBtn" onclick="triggerEnding()">tout assembler...</button>
    </div>
  </div>

  <div class="appscreen" id="app-portier">
    <div class="appheader"><button class="back" data-back>‹</button><span>Portier</span></div>
    <div id="portierList" class="portierList"></div>
  </div>

  <div id="lightbox" class="hidden">
    <div class="lightboxFrame">
      <div class="photoNoise"></div>
      <div class="lightboxCaption"></div>
      <button class="lightboxClose" onclick="closeLightbox()">✕</button>
    </div>
  </div>

  <div id="notifBanner" class="hidden"></div>

  <div id="innerVoice" class="hidden">
    <div id="innerVoiceText"></div>
  </div>
</div>

<div id="dayTransition" class="hidden">
  <div id="dayTransitionText"></div>
</div>

<div id="ending" class="hidden"></div>

<script src="story.js"></script>
<script src="script.js"></script>
</body>
                                                                 </html>
